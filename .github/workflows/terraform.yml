name: Terraform_AWS_EC2_CI-CD

on:
  workflow_dispatch:

jobs:

  Code_Check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Terraform files
        run: |
          echo "Checking terraform files..."
          ls -la

  Terraform_Validate:
    runs-on: ubuntu-latest
    needs: Code_Check

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS Authentication
        run: aws sts get-caller-identity
       
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

  Terraform_Plan:
    runs-on: ubuntu-latest
    needs: Terraform_Validate

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS Authentication
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  Terraform_Apply:
    runs-on: ubuntu-latest
    needs: Terraform_Plan

    outputs:
      public_ip: ${{ steps.get_ip.outputs.public_ip }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Terraform Output
        run: terraform output

      - name: Get EC2 Public IP
        id: get_ip
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

  App_Verify:
    runs-on: ubuntu-latest
    needs: Terraform_Apply

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Verify Nginx
        run: |
          PUBLIC_IP="${{ needs.Terraform_Apply.outputs.public_ip }}"

          echo "Application URL:"
          echo "http://$PUBLIC_IP"

          echo "Waiting for Nginx to start..."

          for i in {1..12}; do
            if curl -f --connect-timeout 5 "http://$PUBLIC_IP"; then
              echo ""
              echo "Nginx is working successfully!"
              exit 0
            fi

            echo "Nginx is not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "Nginx verification failed."
          exit 1

  Wait:
    runs-on: ubuntu-latest
    needs: App_Verify

    steps:

      - name: Wait Before Destroy
        run: |
          echo "EC2 will remain running for 2 minutes..."
          sleep 120

  Terraform_Destroy:
    runs-on: ubuntu-latest
    needs: Wait

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: |
          echo "Starting Terraform Destroy..."
          terraform destroy -auto-approve
          echo "AWS infrastructure destroyed successfully."
